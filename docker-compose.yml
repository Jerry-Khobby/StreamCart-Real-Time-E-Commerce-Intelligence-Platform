# ============================================================================
# STREAMCART DATA PLATFORM - DOCKER COMPOSE
# ============================================================================
# Service topology:
#   Infrastructure: postgres, minio, zookeeper, kafka, schema-registry
#   Orchestration:   airflow (init, webserver, scheduler)
#   Processing:      spark (master, worker, bronze job)
#   Real-time:       ksqldb, realtime-sink
#   Data generation: data-seed (one-shot history), data-generator (live)
#   Serving:         api, grafana, superset
#
# Layers: COMPOSE_PROFILES in .env chooses what starts, so a smaller machine can
# run just the part being worked on. Kafka, Schema Registry, Postgres and the
# simulator always run.
#   full      everything
#   realtime  ksqlDB, serving sink, REST API, Grafana
#   batch     MinIO, Spark, Bronze stream, Airflow, dbt
#   bi        Superset (needs Gold, so run batch at least once first)
# ============================================================================

# ── YAML ANCHORS ────────────────────────────────────────────────────────────

x-platform-image: &platform-image
  image: streamcart-platform:latest
  build:
    context: .
    dockerfile: Dockerfile

x-airflow-env: &airflow-env
  env_file: .env
  environment:
    # Airflow core
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    # Keep Airflow light: this is a single-machine stack with a few small DAGs
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__WEBSERVER__WORKERS: "1"
    AIRFLOW__WEBSERVER__WORKER_REFRESH_BATCH_SIZE: "0"
    # Booting beside the whole stack can exceed the default 120 seconds.
    AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: "600"
    AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: "300"
    AIRFLOW__SCHEDULER__PARSING_PROCESSES: "1"
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: "120"
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "300"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Airflow, its tasks, dbt and the Spark jobs it submits use the application login,
    # never the Postgres superuser (see migration V8).
    POSTGRES_USER: ${POSTGRES_APP_USER:-streamcart_app}
    POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:-streamcart_app}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_APP_USER:-streamcart_app}:${POSTGRES_APP_PASSWORD:-streamcart_app}@postgres:5432/${POSTGRES_DB}
    # Airflow connections used by the DAGs
    # The Spark hook builds --master from host:port, so the host carries the scheme.
    AIRFLOW_CONN_SPARK_DEFAULT: '{"conn_type": "spark", "host": "spark://spark-master", "port": 7077}'
    AIRFLOW_CONN_STREAMCART_POSTGRES: postgres://${POSTGRES_APP_USER:-streamcart_app}:${POSTGRES_APP_PASSWORD:-streamcart_app}@postgres:5432/${POSTGRES_DB}
    # PostgreSQL
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    # dbt
    DBT_PROFILES_DIR: /opt/airflow/dbt
    DBT_TARGET: dev

x-airflow-volumes: &airflow-volumes
  volumes:
    - ./batch/dags:/opt/airflow/dags
    - ./batch/dbt:/opt/airflow/dbt
    - ./consumer:/opt/airflow/consumer
    - ./producer:/opt/airflow/producer
    - ./quality:/opt/airflow/quality
    - ./schemas:/opt/airflow/schemas
    - ./tests:/opt/airflow/tests
    - ./logs:/opt/airflow/logs

x-airflow-common: &airflow-common
  <<: [*platform-image, *airflow-env, *airflow-volumes]
  networks:
    - streamcart-net
  restart: unless-stopped

# Spark runs from the platform image too, so the driver and executors always
# agree on Python and Spark versions. The command replaces the Airflow entrypoint.
x-spark-common: &spark-common
  <<: *platform-image
  env_file: .env
  entrypoint: ["/bin/bash", "-c"]
  volumes:
    - ./consumer:/opt/airflow/consumer
    - ./producer:/opt/airflow/producer
    - ./schemas:/opt/airflow/schemas
    - ./logs:/opt/airflow/logs
  networks:
    - streamcart-net
  restart: unless-stopped

# Shared by the live generator, the history seed and the schema registration step.
x-producer-common: &producer-common
  <<: *platform-image
  env_file: .env
  environment:
    USE_KAFKA: "true"
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    SCHEMA_REGISTRY_URL: http://schema-registry:8081
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_USER: ${POSTGRES_APP_USER:-streamcart_app}
    POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:-streamcart_app}
  volumes:
    - ./producer:/opt/airflow/producer:ro
    - ./schemas:/opt/airflow/schemas:ro
    - ./logs:/opt/airflow/logs
  networks:
    - streamcart-net

# ── SERVICES ────────────────────────────────────────────────────────────────
# start_period only stops failures being counted while a service boots, and a
# service still turns healthy as soon as it's ready. It's set high because a cold
# start of this whole stack can take minutes, and compose abandons anything that
# depends on a service it has marked unhealthy.

services:
  # ══════════════════════════════════════════════════════════════════════════
  # INFRASTRUCTURE LAYER
  # ══════════════════════════════════════════════════════════════════════════

  # ── PostgreSQL (Airflow metadata + application database) ─────────────────
  # Three logins: the superuser (Postgres and migrations only), the application role
  # (everything that writes) and the read-only role (dashboards and the API).
  postgres:
    image: postgres:15-alpine
    container_name: streamcart-postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./batch/db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      # Over TCP: the image's temporary init server only listens on a Unix socket, so a
      # socket check reports healthy before the real server has started.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 300s
    networks:
      - streamcart-net
    restart: unless-stopped

  # ── Schema migrations (Flyway) ─────────────────────────────────────────────
  # Applies batch/db/migrations in order and records each one, so new and existing
  # databases both end up on the latest schema. Everything that writes to Postgres waits for it.
  db-migrate:
    image: flyway/flyway:10.20.1-alpine
    container_name: streamcart-db-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_PLACEHOLDERS_READER_USER: ${POSTGRES_READER_USER}
      FLYWAY_PLACEHOLDERS_READER_PASSWORD: ${POSTGRES_READER_PASSWORD}
      FLYWAY_PLACEHOLDERS_APP_USER: ${POSTGRES_APP_USER:-streamcart_app}
      FLYWAY_PLACEHOLDERS_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-streamcart_app}
      # Databases created before Flyway was added already have Airflow's tables.
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_BASELINE_VERSION: "0"
      FLYWAY_CONNECT_RETRIES: "60"
    volumes:
      - ./batch/db/migrations:/flyway/sql:ro
    command: migrate
    networks:
      - streamcart-net
    restart: "no"

  # ── MinIO (S3-compatible object storage for the lakehouse) ───────────────
  # The official minio/minio images are no longer published on Docker Hub or Quay.
  # This pinned Bitnami build is the same server, and creates the buckets itself.
  minio:
    image: bitnamilegacy/minio:2025.7.23
    container_name: streamcart-minio
    profiles: ["batch", "full"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKETS: ${MINIO_BUCKET},${MINIO_BUCKET}-archive
      # This image leaves the web console off unless asked.
      MINIO_BROWSER: "on"
    volumes:
      - minio-data:/bitnami/minio/data
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 300s
    networks:
      - streamcart-net
    restart: unless-stopped

  # ── Zookeeper (Kafka coordination) ───────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.7
    container_name: streamcart-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: "-Xms64m -Xmx128m"
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 300s
    networks:
      - streamcart-net
    restart: unless-stopped

  # ── Kafka (event streaming platform) ─────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.7.7
    container_name: streamcart-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # ksqlDB writes its command topic in transactions. The defaults need 3 brokers.
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: "168"
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx384m"
    ports:
      - "9092:9092"
      - "9093:9093"
    healthcheck:
      # A port check: kafka-topics would start a whole new JVM on every check.
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 300s
    networks:
      - streamcart-net
    restart: unless-stopped

  kafka-init:
    image: confluentinc/cp-kafka:7.7.7
    container_name: streamcart-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic transactions --partitions 5 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic clickstream --partitions 5 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic inventory_updates --partitions 5 --replication-factor 1;
        echo 'Kafka topics ready.';
      "
    networks:
      - streamcart-net
    restart: "no"

  # ── Schema Registry (Avro contracts) ──────────────────────────────────────
  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.7
    container_name: streamcart-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_HEAP_OPTS: "-Xms64m -Xmx192m"
    ports:
      - "${SCHEMA_REGISTRY_HOST_PORT:-8085}:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 300s
    networks:
      - streamcart-net
    restart: unless-stopped

  schema-init:
    <<: *producer-common
    container_name: streamcart-schema-init
    depends_on:
      schema-registry:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    command: python -m producer.register_schemas
    restart: "no"

  # ══════════════════════════════════════════════════════════════════════════
  # ORCHESTRATION LAYER (Airflow)
  # ══════════════════════════════════════════════════════════════════════════

  # ── Airflow database initialization ───────────────────────────────────────
  airflow-init:
    <<: *airflow-common
    container_name: streamcart-airflow-init
    profiles: ["batch", "full"]
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - ./batch/dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./wait-for-postgres-and-init.sh:/opt/airflow/wait-for-postgres-and-init.sh:ro
    entrypoint: ["/bin/bash"]
    command: ["/opt/airflow/wait-for-postgres-and-init.sh"]
    restart: "no"

  # ── Airflow webserver (UI) ────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: streamcart-airflow-webserver
    profiles: ["batch", "full"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "${AIRFLOW_HOST_PORT:-8080}:8080"
    command: webserver
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s

  # ── Airflow scheduler (DAG execution engine) ──────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: streamcart-airflow-scheduler
    profiles: ["batch", "full"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command: scheduler
    healthcheck:
      # The scheduler's own health endpoint. "airflow jobs check" starts a whole
      # Airflow process on every check, which is a constant drain.
      test: ["CMD-SHELL", "curl -f http://localhost:8974/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s

  # ══════════════════════════════════════════════════════════════════════════
  # PROCESSING LAYER (Spark)
  # ══════════════════════════════════════════════════════════════════════════

  # ── Spark master (cluster manager) ────────────────────────────────────────
  spark-master:
    <<: *spark-common
    container_name: streamcart-spark-master
    profiles: ["batch", "full"]
    environment:
      SPARK_DAEMON_MEMORY: 256m
    command: ["spark-class org.apache.spark.deploy.master.Master --host spark-master --port 7077 --webui-port 8080"]
    ports:
      - "${SPARK_UI_HOST_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 300s

  # ── Spark worker (execution node) ─────────────────────────────────────────
  # 1 core for the streaming Bronze job + 2 for whichever batch job is running.
  spark-worker:
    <<: *spark-common
    container_name: streamcart-spark-worker
    profiles: ["batch", "full"]
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      SPARK_WORKER_DIR: /tmp/spark-work
      SPARK_DAEMON_MEMORY: 256m
    command: ["spark-class org.apache.spark.deploy.worker.Worker --cores 3 --memory 2g --webui-port 8081 spark://spark-master:7077"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s

  # ── Spark Bronze layer (Kafka → MinIO streaming) ──────────────────────────
  spark-bronze-job:
    <<: *spark-common
    container_name: streamcart-spark-bronze
    profiles: ["batch", "full"]
    depends_on:
      spark-worker:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    # Without spark.cores.max a streaming app takes every core and no batch job
    # can ever start ("Initial job has not accepted any resources").
    command:
      - >-
        spark-submit
        --master spark://spark-master:7077
        --conf spark.driver.host=spark-bronze-job
        --conf spark.driver.bindAddress=0.0.0.0
        --conf spark.driver.memory=640m
        --conf spark.cores.max=1
        --conf spark.executor.memory=640m
        --conf spark.sql.shuffle.partitions=2
        --conf spark.ui.enabled=false
        /opt/airflow/consumer/spark_streaming.py
    # The Iceberg catalog in Postgres is reached with the application login.
    environment:
      POSTGRES_USER: ${POSTGRES_APP_USER:-streamcart_app}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:-streamcart_app}
    # Always restart: the checkpoint resumes exactly where the stream stopped.
    restart: unless-stopped

  # ══════════════════════════════════════════════════════════════════════════
  # DATA GENERATION LAYER
  # ══════════════════════════════════════════════════════════════════════════

  # ── History seed: runs once, so batch dashboards have trends on first start ─
  data-seed:
    <<: *producer-common
    container_name: streamcart-data-seed
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      schema-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command: python -m producer.data_generator --mode backfill --days 14 --tx-per-day 1000
    restart: "no"

  # ── Data generator (live synthetic events) ────────────────────────────────
  data-generator:
    <<: *producer-common
    container_name: streamcart-data-generator
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      schema-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command: python -m producer.data_generator --mode all
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f data_generator || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s

  # ══════════════════════════════════════════════════════════════════════════
  # REAL-TIME LAYER
  # ══════════════════════════════════════════════════════════════════════════

  # ── ksqlDB (fraud alerts and low-stock detection) ─────────────────────────
  ksqldb-server:
    image: confluentinc/cp-ksqldb-server:7.7.7
    container_name: streamcart-ksqldb
    profiles: ["realtime", "full"]
    depends_on:
      schema-registry:
        condition: service_healthy
    environment:
      KSQL_BOOTSTRAP_SERVERS: kafka:9092
      KSQL_LISTENERS: http://0.0.0.0:8088
      KSQL_KSQL_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KSQL_KSQL_SERVICE_ID: streamcart_
      KSQL_KSQL_INTERNAL_TOPIC_REPLICAS: 1
      KSQL_KSQL_SINK_REPLICAS: 1
      KSQL_KSQL_STREAMS_REPLICATION_FACTOR: 1
      KSQL_KSQL_LOGGING_PROCESSING_TOPIC_REPLICATION_FACTOR: 1
      KSQL_HEAP_OPTS: "-Xms128m -Xmx400m"
      KSQL_CONFLUENT_SUPPORT_METRICS_ENABLE: "false"
    ports:
      - "${KSQLDB_HOST_PORT:-8088}:8088"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8088/info || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 15
      # First start creates ksqlDB's internal topics, which can take several minutes.
      start_period: 420s
    networks:
      - streamcart-net
    restart: unless-stopped

  ksqldb-init:
    image: confluentinc/cp-ksqldb-cli:7.7.7
    container_name: streamcart-ksqldb-init
    profiles: ["realtime", "full"]
    depends_on:
      ksqldb-server:
        condition: service_healthy
      schema-init:
        condition: service_completed_successfully
    volumes:
      - ./streaming/ksql:/ksql:ro
    entrypoint: ["/bin/bash", "/ksql/apply.sh"]
    networks:
      - streamcart-net
    restart: "no"

  # ── Serving sink (Kafka → Postgres realtime schema) ───────────────────────
  realtime-sink:
    <<: *producer-common
    container_name: streamcart-realtime-sink
    profiles: ["realtime", "full"]
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      ksqldb-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - ./consumer:/opt/airflow/consumer:ro
      - ./producer:/opt/airflow/producer:ro
      - ./quality:/opt/airflow/quality:ro
      - ./logs:/opt/airflow/logs
    command: python -m consumer.realtime_sink
    restart: unless-stopped

  # ══════════════════════════════════════════════════════════════════════════
  # SERVING LAYER
  # ══════════════════════════════════════════════════════════════════════════

  # ── REST API (live inventory and online fraud features) ───────────────────
  api:
    build: ./api
    image: streamcart-api:latest
    container_name: streamcart-api
    profiles: ["realtime", "full"]
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      # Read-only: the API never writes
      POSTGRES_USER: ${POSTGRES_READER_USER}
      POSTGRES_PASSWORD: ${POSTGRES_READER_PASSWORD}
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    networks:
      - streamcart-net
    restart: unless-stopped

  # ── Grafana (real-time and observability dashboards) ──────────────────────
  grafana:
    image: grafana/grafana-oss:11.5.8
    container_name: streamcart-grafana
    profiles: ["realtime", "full"]
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      # Read-only: dashboards never write
      POSTGRES_USER: ${POSTGRES_READER_USER}
      POSTGRES_PASSWORD: ${POSTGRES_READER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./dashboards/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    networks:
      - streamcart-net
    restart: unless-stopped

  # ── Superset (self-service BI over Gold) ──────────────────────────────────
  superset-init:
    build: ./dashboards/superset
    image: streamcart-superset:latest
    container_name: streamcart-superset-init
    profiles: ["bi", "full"]
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    env_file: .env
    command: ["/app/streamcart/init.sh"]
    networks:
      - streamcart-net
    restart: "no"

  superset:
    image: streamcart-superset:latest
    container_name: streamcart-superset
    profiles: ["bi", "full"]
    depends_on:
      superset-init:
        condition: service_completed_successfully
    env_file: .env
    environment:
      SERVER_WORKER_AMOUNT: "1"
      SERVER_THREADS_AMOUNT: "4"
    ports:
      - "${SUPERSET_HOST_PORT:-8089}:8088"
    networks:
      - streamcart-net
    restart: unless-stopped

# ── VOLUMES ─────────────────────────────────────────────────────────────────

volumes:
  postgres-data:
    driver: local
  minio-data:
    driver: local
  grafana-data:
    driver: local

# ── NETWORKS ────────────────────────────────────────────────────────────────

networks:
  streamcart-net:
    driver: bridge
    name: streamcart-net
