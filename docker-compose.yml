x-airflow-build: &airflow-build
  build:
    context: .
    dockerfile: Dockerfile

x-airflow-env: &airflow-env
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
    MINIO_ENDPOINT: minio:9000
    MINIO_ROOT_USER: ${MINIO_ROOT_USER}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    MINIO_BUCKET: ${MINIO_BUCKET}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

x-airflow-volumes: &airflow-volumes
  volumes:
    - ./batch/dags:/opt/airflow/dags
    - ./batch/dbt:/opt/airflow/dbt
    - ./consumer:/opt/airflow/consumer
    - ./producer:/opt/airflow/producer
    - ./logs:/opt/airflow/logs
    - ./data:/opt/airflow/data
    - ./jars:/opt/airflow/jars

x-airflow-common: &airflow-common
  <<: [*airflow-build, *airflow-env, *airflow-volumes]
  networks:
    - streamcart-net
  restart: unless-stopped

x-spark-common: &spark-common
  image: apache/spark:3.5.0-python3
  user: root
  env_file: .env
  volumes:
    - ./consumer:/opt/airflow/consumer
    - ./producer:/opt/airflow/producer
    - ./logs:/opt/airflow/logs
    - ./data:/opt/airflow/data
    - ./jars:/opt/airflow/jars
  networks:
    - streamcart-net
  restart: unless-stopped

services:
  # ───────────────── POSTGRES ─────────────────
  postgres:
    image: postgres:15-alpine
    container_name: streamcart-postgres
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./batch/db/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
    networks:
      - streamcart-net

  # ───────────────── AIRFLOW INIT ─────────────────
  airflow-init:
    <<: *airflow-common
    container_name: streamcart-airflow-init
    entrypoint: /bin/bash
    command: -c "airflow db migrate && airflow users create --username admin --password admin --firstname admin --lastname user --role Admin --email admin@example.com"
    restart: "no"

  # ───────────────── AIRFLOW WEBSERVER ─────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: streamcart-airflow-webserver
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    command: webserver

  # ───────────────── AIRFLOW SCHEDULER ─────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: streamcart-airflow-scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: scheduler

  # ───────────────── MINIO ─────────────────
  minio:
    image: minio/minio
    container_name: streamcart-minio
    command: server /data --console-address ":9001"
    env_file: .env
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - streamcart-net

  minio-init:
    image: minio/mc
    container_name: streamcart-minio-init
    depends_on:
      - minio
    env_file: .env
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/${MINIO_BUCKET};
      "
    networks:
      - streamcart-net

  # ───────────────── ZOOKEEPER ─────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.7
    container_name: streamcart-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    networks:
      - streamcart-net

  # ───────────────── KAFKA ─────────────────
  kafka:
    image: confluentinc/cp-kafka:7.7.7
    container_name: streamcart-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - streamcart-net

  kafka-init:
    image: confluentinc/cp-kafka:7.7.7
    depends_on:
      - kafka
    entrypoint: >
      /bin/sh -c "
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic transactions --partitions 5 --replication-factor 1;
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic clickstream --partitions 5 --replication-factor 1;
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic inventory_updates --partitions 5 --replication-factor 1;
      "
    networks:
      - streamcart-net

  # ───────────────── DATA GENERATOR ─────────────────
  data-generator:
    <<: *airflow-build
    container_name: streamcart-data-generator
    env_file: .env
    command: python /opt/airflow/producer/data_generator.py --mode all
    volumes:
      - ./producer:/opt/airflow/producer
      - ./logs:/opt/airflow/logs
      - ./data:/opt/airflow/data
    depends_on:
      - kafka-init
    networks:
      - streamcart-net

  # ───────────────── SPARK MASTER ─────────────────
  spark-master:
    <<: *spark-common
    container_name: streamcart-spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      SPARK_MASTER_HOST: spark-master
    ports:
      - "7077:7077"
      - "8081:8080"

  # ───────────────── SPARK WORKER ─────────────────
  spark-worker:
    <<: *spark-common
    container_name: streamcart-spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master

  # ───────────────── SPARK BRONZE STREAMING ─────────────────
  spark-bronze-job:
    <<: *spark-common
    container_name: streamcart-spark-bronze
    command: >
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0
      /opt/airflow/consumer/spark_streaming.py
    depends_on:
      - spark-master
      - kafka-init
      - minio-init

volumes:
  postgres-data:
  minio-data:

networks:
  streamcart-net:
    driver: bridge
