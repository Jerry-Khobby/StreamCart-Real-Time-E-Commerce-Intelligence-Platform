# ============================================================================
# STREAMCART DATA PLATFORM - DOCKER COMPOSE
# ============================================================================
# Service topology:
#   Infrastructure: postgres, minio, zookeeper, kafka
#   Orchestration: airflow (init, webserver, scheduler)
#   Processing: spark (master, worker, bronze-job)
#   Data generation: data-generator
# ============================================================================

# ── YAML ANCHORS ────────────────────────────────────────────────────────────

x-airflow-build: &airflow-build
  build:
    context: .
    dockerfile: Dockerfile

x-airflow-env: &airflow-env
  env_file: .env
  environment:
    # Airflow core
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
    # PostgreSQL
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_DB: ${POSTGRES_DB}
    # MinIO
    MINIO_ENDPOINT: minio:9000
    MINIO_ROOT_USER: ${MINIO_ROOT_USER}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    MINIO_BUCKET: ${MINIO_BUCKET}
    # Spark
    SPARK_MASTER: spark://spark-master:7077
    # dbt
    DBT_PROFILES_DIR: /opt/airflow/dbt
    DBT_TARGET: dev

x-airflow-volumes: &airflow-volumes
  volumes:
    - ./batch/dags:/opt/airflow/dags
    - ./batch/dbt:/opt/airflow/dbt
    - ./consumer:/opt/airflow/consumer
    - ./producer:/opt/airflow/producer
    - ./logs:/opt/airflow/logs
    - ./data:/opt/airflow/data
    - ./jars:/opt/airflow/jars

x-airflow-common: &airflow-common
  <<: [*airflow-build, *airflow-env, *airflow-volumes]
  networks:
    - streamcart-net
  restart: unless-stopped

x-spark-common: &spark-common
  image: apache/spark:3.5.0-python3
  user: root
  env_file: .env
  environment:
    PYTHONPATH: /opt/airflow
    DBT_PROFILES_DIR: /opt/airflow/dbt
    DBT_TARGET: dev
    MINIO_ROOT_USER: ${MINIO_ROOT_USER}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    MINIO_BUCKET: ${MINIO_BUCKET}
  volumes:
    - ./consumer:/opt/airflow/consumer
    - ./producer:/opt/airflow/producer
    - ./data:/opt/airflow/data
    - ./logs:/opt/airflow/logs
    - ./jars:/opt/airflow/jars
  networks:
    - streamcart-net
  restart: unless-stopped

# ── SERVICES ────────────────────────────────────────────────────────────────

services:
  # ══════════════════════════════════════════════════════════════════════════
  # INFRASTRUCTURE LAYER
  # ══════════════════════════════════════════════════════════════════════════

  # ── PostgreSQL (Airflow metadata + application database) ─────────────────
  postgres:
    image: postgres:15-alpine
    container_name: streamcart-postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./batch/db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - streamcart-net
    restart: unless-stopped

  # ── MinIO (S3-compatible object storage for data lake) ───────────────────
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: streamcart-minio
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - streamcart-net
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1
    container_name: streamcart-minio-init
    env_file: .env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
        mc mb --ignore-existing local/$${MINIO_BUCKET};
        echo 'MinIO bucket ready.';
      "
    networks:
      - streamcart-net
    restart: "no"

  # ── Zookeeper (Kafka coordination) ───────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.7
    container_name: streamcart-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - streamcart-net
    restart: unless-stopped

  # ── Kafka (event streaming platform) ─────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.7.7
    container_name: streamcart-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: "168"
    ports:
      - "9092:9092"
      - "9093:9093"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - streamcart-net
    restart: unless-stopped

  kafka-init:
    image: confluentinc/cp-kafka:7.7.7
    container_name: streamcart-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic transactions --partitions 5 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic clickstream --partitions 5 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic inventory_updates --partitions 5 --replication-factor 1;
        echo 'Kafka topics ready.';
      "
    networks:
      - streamcart-net
    restart: "no"

  # ══════════════════════════════════════════════════════════════════════════
  # ORCHESTRATION LAYER (Airflow)
  # ══════════════════════════════════════════════════════════════════════════

  # ── Airflow database initialization ───────────────────────────────────────
  airflow-init:
    <<: *airflow-common
    container_name: streamcart-airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./batch/dags:/opt/airflow/dags
      - ./batch/dbt:/opt/airflow/dbt
      - ./consumer:/opt/airflow/consumer
      - ./producer:/opt/airflow/producer
      - ./logs:/opt/airflow/logs
      - ./data:/opt/airflow/data
      - ./jars:/opt/airflow/jars
      - ./.env:/opt/airflow/.env:ro
      - ./wait-for-postgres-and-init.sh:/opt/airflow/wait-for-postgres-and-init.sh:ro
    entrypoint: ["/bin/bash", "-c"]
    command: ["/opt/airflow/wait-for-postgres-and-init.sh"]
    restart: "no"

  # ── Airflow webserver (UI) ────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: streamcart-airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    command: webserver
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Airflow scheduler (DAG execution engine) ──────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: streamcart-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command: scheduler
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "airflow jobs check --job-type SchedulerJob --hostname $(hostname) || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ══════════════════════════════════════════════════════════════════════════
  # PROCESSING LAYER (Spark)
  # ══════════════════════════════════════════════════════════════════════════

  # ── Spark master (cluster manager) ────────────────────────────────────────
  spark-master:
    <<: *spark-common
    container_name: streamcart-spark-master
    environment:
      PYTHONPATH: /opt/airflow
      DBT_PROFILES_DIR: /opt/airflow/dbt
      DBT_TARGET: dev
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: "7077"
      SPARK_MASTER_WEBUI_PORT: "8080"
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "7077:7077"
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Spark worker (execution node) ─────────────────────────────────────────
  spark-worker:
    <<: *spark-common
    container_name: streamcart-spark-worker
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      PYTHONPATH: /opt/airflow
      DBT_PROFILES_DIR: /opt/airflow/dbt
      DBT_TARGET: dev
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      SPARK_WORKER_CORES: "8"
      SPARK_WORKER_MEMORY: "8g"
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Spark bronze layer (Kafka → MinIO streaming) ─────────────────────────
  spark-bronze-job:
    <<: *spark-common
    container_name: streamcart-spark-bronze
    depends_on:
      spark-master:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      PYTHONPATH: /opt/airflow
      DBT_PROFILES_DIR: /opt/airflow/dbt
      DBT_TARGET: dev
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    command: >
      /opt/spark/bin/spark-submit
        --master spark://spark-master:7077
        --deploy-mode client
        --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262
        --conf spark.hadoop.fs.s3a.endpoint=http://minio:9000
        --conf spark.hadoop.fs.s3a.access.key=$${MINIO_ROOT_USER}
        --conf spark.hadoop.fs.s3a.secret.key=$${MINIO_ROOT_PASSWORD}
        --conf spark.hadoop.fs.s3a.path.style.access=true
        --conf spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
        --conf spark.sql.shuffle.partitions=4
        --conf spark.streaming.stopGracefullyOnShutdown=true
        /opt/airflow/consumer/spark_streaming.py
    restart: on-failure:3

  # ══════════════════════════════════════════════════════════════════════════
  # DATA GENERATION LAYER
  # ══════════════════════════════════════════════════════════════════════════

  # ── Data generator (synthetic event producer) ─────────────────────────────
  data-generator:
    <<: *airflow-build
    container_name: streamcart-data-generator
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    env_file: .env
    environment:
      USE_KAFKA: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./producer:/opt/airflow/producer:ro
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs
    command: python /opt/airflow/producer/data_generator.py --mode all
    networks:
      - streamcart-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f data_generator.py || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# ── VOLUMES ─────────────────────────────────────────────────────────────────

volumes:
  postgres-data:
    driver: local
  minio-data:
    driver: local

# ── NETWORKS ────────────────────────────────────────────────────────────────

networks:
  streamcart-net:
    driver: bridge
    name: streamcart-net
