# ============================================================================
# STREAMCART DATA PLATFORM - DOCKER COMPOSE
# ============================================================================
# Service topology:
#   Infrastructure: postgres, minio, zookeeper, kafka, schema-registry
#   Orchestration: airflow (init, webserver, scheduler)
#   Processing: spark (master, worker, bronze-job)
#   Data generation: data-generator
# ============================================================================

# ── YAML ANCHORS ────────────────────────────────────────────────────────────

x-platform-image: &platform-image
  image: streamcart-platform:latest
  build:
    context: .
    dockerfile: Dockerfile

x-airflow-env: &airflow-env
  env_file: .env
  environment:
    # Airflow core
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    # Airflow connections used by the DAGs
    AIRFLOW_CONN_SPARK_DEFAULT: spark://spark-master:7077
    AIRFLOW_CONN_STREAMCART_POSTGRES: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    # PostgreSQL
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    # dbt
    DBT_PROFILES_DIR: /opt/airflow/dbt
    DBT_TARGET: dev

x-airflow-volumes: &airflow-volumes
  volumes:
    - ./batch/dags:/opt/airflow/dags
    - ./batch/dbt:/opt/airflow/dbt
    - ./consumer:/opt/airflow/consumer
    - ./producer:/opt/airflow/producer
    - ./logs:/opt/airflow/logs

x-airflow-common: &airflow-common
  <<: [*platform-image, *airflow-env, *airflow-volumes]
  networks:
    - streamcart-net
  restart: unless-stopped

# Spark runs from the platform image too, so the driver and executors always
# agree on Python and Spark versions. The command replaces the Airflow entrypoint.
x-spark-common: &spark-common
  <<: *platform-image
  env_file: .env
  entrypoint: ["/bin/bash", "-c"]
  volumes:
    - ./consumer:/opt/airflow/consumer
    - ./producer:/opt/airflow/producer
    - ./logs:/opt/airflow/logs
  networks:
    - streamcart-net
  restart: unless-stopped

# ── SERVICES ────────────────────────────────────────────────────────────────

services:
  # ══════════════════════════════════════════════════════════════════════════
  # INFRASTRUCTURE LAYER
  # ══════════════════════════════════════════════════════════════════════════

  # ── PostgreSQL (Airflow metadata + application database) ─────────────────
  postgres:
    image: postgres:15-alpine
    container_name: streamcart-postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./batch/db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - streamcart-net
    restart: unless-stopped

  # ── MinIO (S3-compatible object storage for the lakehouse) ───────────────
  # The official minio/minio images are no longer published on Docker Hub or Quay.
  # This pinned Bitnami build is the same server, and creates the buckets itself.
  minio:
    image: bitnamilegacy/minio:2025.7.23
    container_name: streamcart-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKETS: ${MINIO_BUCKET},${MINIO_BUCKET}-archive
    volumes:
      - minio-data:/bitnami/minio/data
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - streamcart-net
    restart: unless-stopped

  # ── Zookeeper (Kafka coordination) ───────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.7
    container_name: streamcart-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - streamcart-net
    restart: unless-stopped

  # ── Kafka (event streaming platform) ─────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.7.7
    container_name: streamcart-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: "168"
    ports:
      - "9092:9092"
      - "9093:9093"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - streamcart-net
    restart: unless-stopped

  kafka-init:
    image: confluentinc/cp-kafka:7.7.7
    container_name: streamcart-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic transactions --partitions 5 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic clickstream --partitions 5 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic inventory_updates --partitions 5 --replication-factor 1;
        echo 'Kafka topics ready.';
      "
    networks:
      - streamcart-net
    restart: "no"

  # ══════════════════════════════════════════════════════════════════════════
  # ORCHESTRATION LAYER (Airflow)
  # ══════════════════════════════════════════════════════════════════════════

  # ── Airflow database initialization ───────────────────────────────────────
  airflow-init:
    <<: *airflow-common
    container_name: streamcart-airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./batch/dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./wait-for-postgres-and-init.sh:/opt/airflow/wait-for-postgres-and-init.sh:ro
    entrypoint: ["/bin/bash"]
    command: ["/opt/airflow/wait-for-postgres-and-init.sh"]
    restart: "no"

  # ── Airflow webserver (UI) ────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: streamcart-airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "${AIRFLOW_HOST_PORT:-8080}:8080"
    command: webserver
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Airflow scheduler (DAG execution engine) ──────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: streamcart-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command: scheduler
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "airflow jobs check --job-type SchedulerJob --hostname $$(hostname) || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ══════════════════════════════════════════════════════════════════════════
  # PROCESSING LAYER (Spark)
  # ══════════════════════════════════════════════════════════════════════════

  # ── Spark master (cluster manager) ────────────────────────────────────────
  spark-master:
    <<: *spark-common
    container_name: streamcart-spark-master
    command: ["spark-class org.apache.spark.deploy.master.Master --host spark-master --port 7077 --webui-port 8080"]
    ports:
      - "${SPARK_UI_HOST_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Spark worker (execution node) ─────────────────────────────────────────
  # 2 cores for the streaming Bronze job + 2 for whichever batch job is running.
  spark-worker:
    <<: *spark-common
    container_name: streamcart-spark-worker
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      SPARK_WORKER_DIR: /tmp/spark-work
    command: ["spark-class org.apache.spark.deploy.worker.Worker --cores 4 --memory 3g --webui-port 8081 spark://spark-master:7077"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Spark Bronze layer (Kafka → MinIO streaming) ──────────────────────────
  spark-bronze-job:
    <<: *spark-common
    container_name: streamcart-spark-bronze
    depends_on:
      spark-worker:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    # Without spark.cores.max a streaming app takes every core and no batch job
    # can ever start ("Initial job has not accepted any resources").
    command:
      - >-
        spark-submit
        --master spark://spark-master:7077
        --conf spark.driver.host=spark-bronze-job
        --conf spark.driver.bindAddress=0.0.0.0
        --conf spark.driver.memory=1g
        --conf spark.cores.max=2
        --conf spark.executor.memory=1g
        --conf spark.sql.shuffle.partitions=4
        /opt/airflow/consumer/spark_streaming.py
    restart: on-failure:5

  # ══════════════════════════════════════════════════════════════════════════
  # DATA GENERATION LAYER
  # ══════════════════════════════════════════════════════════════════════════

  # ── Data generator (synthetic event producer) ─────────────────────────────
  data-generator:
    <<: *platform-image
    container_name: streamcart-data-generator
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    env_file: .env
    environment:
      USE_KAFKA: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./producer:/opt/airflow/producer:ro
      - ./logs:/opt/airflow/logs
    command: python /opt/airflow/producer/data_generator.py --mode all
    networks:
      - streamcart-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f data_generator.py || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# ── VOLUMES ─────────────────────────────────────────────────────────────────

volumes:
  postgres-data:
    driver: local
  minio-data:
    driver: local

# ── NETWORKS ────────────────────────────────────────────────────────────────

networks:
  streamcart-net:
    driver: bridge
    name: streamcart-net
