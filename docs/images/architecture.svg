<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" width="1400" height="860" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">StreamCart architecture</title>
  <desc id="d">A simulator feeds Kafka and a transactional Postgres database. A speed path runs Kafka through ksqlDB and a serving sink to Postgres, Grafana and a REST API. A batch path runs Kafka through Spark into Bronze and Silver Iceberg tables on MinIO, then Postgres, where dbt builds Gold for Superset. Airflow orchestrates the batch path.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#3b4656"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2570c"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d5fa8"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6b7686"/></marker>
    <style>
      .h{font-size:13px;font-weight:700;letter-spacing:.06em;fill:#3b4656}
      .n{font-size:15px;font-weight:700;fill:#17202c}
      .s{font-size:12px;fill:#465263}
      .l{font-size:11.5px;fill:#465263}
      .box{fill:#fff;stroke:#7d8896;stroke-width:1.2}
      .sp{fill:#fff;stroke:#c2570c;stroke-width:1.5}
      .ba{fill:#fff;stroke:#1d5fa8;stroke-width:1.5}
      .af{stroke:#3b4656;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .of{stroke:#c2570c;stroke-width:2;fill:none;marker-end:url(#o)}
      .bf{stroke:#1d5fa8;stroke-width:2;fill:none;marker-end:url(#b)}
      .df{stroke:#6b7686;stroke-width:1.4;stroke-dasharray:5 4;fill:none;marker-end:url(#g)}
    </style>
  </defs>

  <rect width="1400" height="860" fill="#ffffff"/>
  <text x="20" y="34" font-size="22" font-weight="700" fill="#17202c">StreamCart architecture</text>
  <text x="20" y="56" font-size="13.5" fill="#465263">One event stream, two paths: seconds-old operational alerts and validated historical analytics.</text>

  <!-- Panels -->
  <rect x="20" y="74" width="205" height="580" rx="10" fill="#f3f5f8" stroke="#d5dbe3"/>
  <text x="36" y="98" class="h">SOURCES</text>
  <rect x="245" y="74" width="1135" height="222" rx="10" fill="#fdf3ea" stroke="#f0d4bc"/>
  <text x="262" y="98" class="h" style="fill:#a84a0a">SPEED PATH: SECONDS</text>
  <rect x="245" y="308" width="1135" height="346" rx="10" fill="#edf4fb" stroke="#c9dcf0"/>
  <text x="470" y="642" class="h" style="fill:#1d5fa8">BATCH PATH: HOURLY AND DAILY</text>

  <!-- Sources -->
  <rect class="box" x="36" y="112" width="173" height="82" rx="7"/>
  <text x="48" y="136" class="n">Data simulator</text>
  <text x="48" y="156" class="s">orders, clickstream, stock</text>
  <text x="48" y="173" class="s">fraud, bots, bad data</text>

  <rect class="box" x="36" y="348" width="173" height="82" rx="7"/>
  <text x="48" y="372" class="n">Transactional DB</text>
  <text x="48" y="392" class="s">Postgres, oltp schema</text>
  <text x="48" y="409" class="s">users, orders, payments</text>

  <rect class="box" x="36" y="520" width="173" height="100" rx="7"/>
  <text x="48" y="544" class="n">External sources</text>
  <text x="48" y="564" class="s">open.er-api: FX rates</text>
  <text x="48" y="581" class="s">Open-Meteo: weather</text>
  <text x="48" y="598" class="s">Inventory REST API</text>

  <!-- Kafka -->
  <rect class="sp" x="270" y="112" width="180" height="162" rx="7"/>
  <text x="284" y="136" class="n">Apache Kafka</text>
  <text x="284" y="156" class="s">transactions, clickstream,</text>
  <text x="284" y="173" class="s">inventory_updates</text>
  <text x="284" y="190" class="s">one partition per region</text>
  <line x1="284" y1="204" x2="436" y2="204" stroke="#e6c3a6"/>
  <text x="284" y="225" class="n">Schema Registry</text>
  <text x="284" y="245" class="s">Avro contracts, BACKWARD</text>
  <text x="284" y="262" class="s">compatibility enforced</text>

  <!-- ksqlDB -->
  <rect class="sp" x="510" y="136" width="170" height="138" rx="7"/>
  <text x="524" y="160" class="n">ksqlDB</text>
  <text x="524" y="180" class="s">reads transactions and</text>
  <text x="524" y="197" class="s">inventory_updates</text>
  <text x="524" y="222" class="s">writes back fraud_alerts</text>
  <text x="524" y="239" class="s">and restock_required</text>
  <text x="524" y="256" class="s">topics to Kafka</text>

  <!-- Sink -->
  <rect class="sp" x="745" y="136" width="150" height="138" rx="7"/>
  <text x="759" y="160" class="n">Serving sink</text>
  <text x="759" y="180" class="s">Python consumer</text>
  <text x="759" y="197" class="s">idempotent upserts</text>
  <text x="759" y="222" class="s">samples consumer lag</text>
  <text x="759" y="239" class="s">and event latency</text>

  <!-- Realtime PG -->
  <rect class="sp" x="950" y="136" width="170" height="138" rx="7"/>
  <text x="964" y="160" class="n">Postgres: realtime</text>
  <text x="964" y="180" class="s">transactions, fraud_alerts</text>
  <text x="964" y="197" class="s">stock_levels</text>
  <text x="964" y="214" class="s">restock_events</text>
  <text x="964" y="231" class="s">pipeline_lag</text>
  <text x="964" y="256" class="s">events kept for 48 hours</text>

  <!-- Consumers top -->
  <rect class="box" x="1190" y="112" width="170" height="70" rx="7"/>
  <text x="1204" y="136" class="n">Grafana</text>
  <text x="1204" y="156" class="s">live operations and</text>
  <text x="1204" y="172" class="s">pipeline observability</text>
  <rect class="box" x="1190" y="204" width="170" height="70" rx="7"/>
  <text x="1204" y="228" class="n">REST API (FastAPI)</text>
  <text x="1204" y="248" class="s">live inventory, online</text>
  <text x="1204" y="264" class="s">fraud model features</text>

  <!-- Spark ingestion -->
  <rect class="ba" x="270" y="348" width="180" height="82" rx="7"/>
  <text x="284" y="372" class="n">Spark Streaming</text>
  <text x="284" y="392" class="s">decodes Avro</text>
  <text x="284" y="409" class="s">one-minute micro-batches</text>
  <rect class="ba" x="270" y="448" width="180" height="62" rx="7"/>
  <text x="284" y="472" class="n">Spark batch extract</text>
  <text x="284" y="492" class="s">daily, JDBC from OLTP</text>

  <!-- Lake -->
  <rect x="490" y="340" width="410" height="186" rx="9" fill="#dcebf9" stroke="#1d5fa8" stroke-dasharray="6 4"/>
  <text x="504" y="362" class="h" style="fill:#1d5fa8">LAKEHOUSE: ICEBERG ON MINIO</text>
  <rect class="ba" x="504" y="374" width="170" height="138" rx="7"/>
  <text x="518" y="398" class="n">Bronze</text>
  <text x="518" y="418" class="s">raw and unmodified</text>
  <text x="518" y="435" class="s">region/year/month/day</text>
  <text x="518" y="452" class="s">Snappy Parquet</text>
  <text x="518" y="469" class="s">time travel</text>
  <text x="518" y="486" class="s">90 days, then archived</text>
  <rect class="ba" x="722" y="374" width="164" height="138" rx="7"/>
  <text x="736" y="398" class="n">Silver</text>
  <text x="736" y="418" class="s">Great Expectations gate</text>
  <text x="736" y="435" class="s">bots filtered</text>
  <text x="736" y="452" class="s">sessions stitched</text>
  <text x="736" y="469" class="s">USD at transaction rate</text>
  <text x="736" y="486" class="s">deduped: MERGE INTO</text>

  <!-- Warehouse -->
  <rect x="950" y="340" width="186" height="298" rx="9" fill="#dcebf9" stroke="#1d5fa8" stroke-dasharray="6 4"/>
  <text x="964" y="362" class="h" style="fill:#1d5fa8">POSTGRES WAREHOUSE</text>
  <rect class="ba" x="962" y="374" width="162" height="74" rx="7"/>
  <text x="976" y="396" class="n">silver schema</text>
  <text x="976" y="415" class="s">published from Iceberg</text>
  <text x="976" y="432" class="s">plus FX and weather</text>
  <rect class="ba" x="962" y="470" width="162" height="50" rx="7"/>
  <text x="976" y="492" class="n">dbt</text>
  <text x="976" y="509" class="s">tested in gold_next</text>
  <rect class="ba" x="962" y="542" width="162" height="84" rx="7"/>
  <text x="976" y="564" class="n">gold schema</text>
  <text x="976" y="583" class="s">4 dimensions, 3 facts</text>
  <text x="976" y="600" class="s">6 KPI aggregates</text>

  <!-- Superset -->
  <rect class="box" x="1190" y="548" width="170" height="72" rx="7"/>
  <text x="1204" y="572" class="n">Apache Superset</text>
  <text x="1204" y="592" class="s">revenue, retention,</text>
  <text x="1204" y="608" class="s">funnel, top products</text>

  <!-- Flows: sources -->
  <path class="of" d="M209 153H270"/>
  <path class="af" d="M122 194V348"/>
  <text x="130" y="262" class="l">writes orders</text>
  <path class="bf" d="M209 389H232V479H270"/>

  <!-- Speed flows -->
  <path class="of" d="M450 176H510"/>
  <path class="of" d="M510 232H450"/>
  <path class="of" d="M432 112V90H820V136"/>
  <text x="470" y="84" class="l">the sink consumes all four event and alert topics</text>
  <path class="of" d="M895 205H950"/>
  <path class="of" d="M1120 170H1155V147H1190"/>
  <path class="of" d="M1120 240H1190"/>

  <!-- Batch flows -->
  <path class="bf" d="M360 274V348"/>
  <path class="bf" d="M450 400H504"/>
  <path class="bf" d="M450 479H470V470H504"/>
  <path class="bf" d="M674 443H722"/>
  <path class="bf" d="M886 411H962"/>
  <path class="bf" d="M1043 448V470"/>
  <path class="bf" d="M1043 520V542"/>
  <path class="bf" d="M1124 584H1190"/>
  <path class="df" d="M209 575H935V420H962"/>
  <text x="470" y="568" class="l">hourly Airflow tasks: FX rates, weather, stock snapshots</text>
  <path class="df" d="M962 438H912V500H886"/>
  <text x="812" y="545" class="l">Silver reads FX rates</text>

  <!-- Observability -->
  <path class="df" d="M1136 400H1170V165H1190"/>
  <text x="1176" y="330" class="l">observability schema,</text>
  <text x="1176" y="346" class="l">Airflow run history</text>

  <!-- Airflow -->
  <rect x="245" y="668" width="1135" height="112" rx="10" fill="#f3f5f8" stroke="#d5dbe3"/>
  <text x="262" y="692" class="h">ORCHESTRATION: APACHE AIRFLOW</text>
  <g class="s">
    <text x="262" y="716" class="s"><tspan font-weight="700">Hourly:</tspan> silver_pipeline, fx_rates_refresh, external_sources</text>
    <text x="262" y="738" class="s"><tspan font-weight="700">Daily:</tspan> oltp_daily_batch, bronze_maintenance, housekeeping</text>
    <text x="262" y="760" class="s"><tspan font-weight="700">When Silver updates:</tspan> gold_dbt_pipeline   <tspan font-weight="700">Weekly:</tspan> historical_backfill</text>
    <text x="800" y="716" class="s"><tspan font-weight="700">Every 15 minutes:</tspan> observability_monitor</text>
    <text x="800" y="738" class="s">row counts, freshness, schema changes, volume, fraud scores</text>
  </g>
  <path class="df" d="M360 668V510"/>
  <path class="df" d="M804 668V512"/>
  <path class="df" d="M1043 668V638"/>

  <!-- Legend -->
  <g transform="translate(20 800)">
    <line x1="0" y1="10" x2="36" y2="10" stroke="#c2570c" stroke-width="2"/><text x="44" y="14" class="l">speed path</text>
    <line x1="130" y1="10" x2="166" y2="10" stroke="#1d5fa8" stroke-width="2"/><text x="174" y="14" class="l">batch path</text>
    <line x1="260" y1="10" x2="296" y2="10" stroke="#6b7686" stroke-width="1.4" stroke-dasharray="5 4"/><text x="304" y="14" class="l">scheduled or supporting flow</text>
    <text x="500" y="14" class="l">All Postgres schemas share one instance, which also holds Airflow metadata and the Iceberg catalog. Everything runs in Docker Compose.</text>
  </g>
</svg>
