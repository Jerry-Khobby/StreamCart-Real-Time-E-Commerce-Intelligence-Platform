# models/staging/sources.yml
# Declares the Silver-layer tables that dbt reads from.
# The Silver Spark job merges into Iceberg, then publishes to these Postgres tables.

version: 2

sources:
  - name: silver
    description: "Cleaned and validated Silver data, published from Iceberg to Postgres."
    database: "{{ env_var('POSTGRES_DB') }}"
    schema: silver
    # Warn only: a laptop that has been asleep shouldn't fail the whole Gold build.
    freshness:
      warn_after: { count: 3, period: hour }
    loaded_at_field: event_time

    tables:
      - name: transactions
        description: "Deduplicated, validated transactions with USD-normalised amounts."
        columns:
          - name: transaction_id
            tests: [unique, not_null]
          - name: user_id
            tests: [not_null]
          - name: amount_usd
            tests: [not_null]
          - name: currency
            tests:
              - not_null
              - accepted_values:
                  values: ["USD", "EUR", "JPY", "NGN", "BRL"]
          - name: status
            tests:
              - accepted_values:
                  values: ["completed", "pending", "refunded", "failed"]
          - name: event_time
            tests: [not_null]

      - name: clickstream
        description: "Bot-filtered, session-stitched clickstream events."
        columns:
          - name: event_id
            tests: [unique, not_null]
          - name: user_id
            tests: [not_null]
          - name: session_id
            tests: [not_null]

      - name: weather_hourly
        description: "Hourly temperature and rainfall per market, from Open-Meteo."
        loaded_at_field: observed_at
        columns:
          - name: region
            tests: [not_null]
          - name: observed_at
            tests: [not_null]

      - name: inventory
        description: "Validated inventory delta events from all warehouses."
        columns:
          - name: event_id
            tests: [unique, not_null]
          - name: product_id
            tests: [not_null]
          - name: quantity_delta
            tests: [not_null]
