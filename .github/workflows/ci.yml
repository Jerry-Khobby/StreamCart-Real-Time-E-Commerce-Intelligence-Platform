name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and config checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.6.9
      - name: Lint Python
        run: ruff check .
      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Validate JSON assets
        run: |
          for f in schemas/avro/*.avsc quality/expectations/*.json dashboards/grafana/dashboards/*.json; do
            python -m json.tool "$f" > /dev/null || { echo "Invalid JSON: $f"; exit 1; }
          done

  tests:
    name: Python tests
    runs-on: ubuntu-latest
    env:
      LOG_DIR: /tmp/streamcart-logs
      AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/batch/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      # Spark needs Java, and the driver and tests run on this version in production.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: |
          pip install "apache-airflow==2.8.1" -r requirements.txt \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.8.1/constraints-3.11.txt"
      - name: Run tests
        run: python -m pytest tests -q -W ignore

  dbt:
    name: dbt build against Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: streamcart
          POSTGRES_PASSWORD: streamcart
          POSTGRES_DB: streamcart_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U streamcart"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      # dbt runs as the application login, as in the stack; psql steps use the superuser.
      POSTGRES_USER: streamcart_app
      POSTGRES_PASSWORD: streamcart_app
      POSTGRES_DB: streamcart_db
      PGPASSWORD: streamcart
      DBT_PROFILES_DIR: ${{ github.workspace }}/batch/dbt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install dbt-core==1.7.13 dbt-postgres==1.7.13
      - name: Create the databases
        run: psql -h localhost -U streamcart -d streamcart_db -v ON_ERROR_STOP=1 -f batch/db/init/00_databases.sql
      # The same Flyway version and migrations as the db-migrate service.
      - name: Apply migrations
        run: |
          docker run --rm --network host -v "$PWD/batch/db/migrations:/flyway/sql:ro" \
            -e FLYWAY_URL=jdbc:postgresql://localhost:5432/streamcart_db -e FLYWAY_USER=streamcart -e FLYWAY_PASSWORD=streamcart \
            -e FLYWAY_PLACEHOLDERS_READER_USER=streamcart_reader -e FLYWAY_PLACEHOLDERS_READER_PASSWORD=streamcart_reader             -e FLYWAY_PLACEHOLDERS_APP_USER=streamcart_app -e FLYWAY_PLACEHOLDERS_APP_PASSWORD=streamcart_app \
            -e FLYWAY_BASELINE_ON_MIGRATE=true -e FLYWAY_BASELINE_VERSION=0 \
            flyway/flyway:10.20.1-alpine migrate
      # A second run must find nothing to do, as on every restart.
      - name: Apply migrations again
        run: |
          docker run --rm --network host -v "$PWD/batch/db/migrations:/flyway/sql:ro" \
            -e FLYWAY_URL=jdbc:postgresql://localhost:5432/streamcart_db -e FLYWAY_USER=streamcart -e FLYWAY_PASSWORD=streamcart \
            -e FLYWAY_PLACEHOLDERS_READER_USER=streamcart_reader -e FLYWAY_PLACEHOLDERS_READER_PASSWORD=streamcart_reader             -e FLYWAY_PLACEHOLDERS_APP_USER=streamcart_app -e FLYWAY_PLACEHOLDERS_APP_PASSWORD=streamcart_app \
            -e FLYWAY_BASELINE_ON_MIGRATE=true -e FLYWAY_BASELINE_VERSION=0 \
            flyway/flyway:10.20.1-alpine migrate
      - name: Install dbt packages
        working-directory: batch/dbt
        run: dbt deps
      # Airflow can run Gold before Silver has data. Incremental models must survive that.
      # Layer by layer on empty tables, exactly as gold_dbt_pipeline runs on a fresh install.
      - name: Build Gold on an empty Silver
        working-directory: batch/dbt
        run: |
          dbt seed
          for layer in staging dimensions facts aggregates; do
            dbt build --select "$layer" --indirect-selection buildable
          done
      - name: Load sample Silver rows
        run: psql -h localhost -U streamcart -d streamcart_db -v ON_ERROR_STOP=1 -f tests/fixtures/silver_sample.sql
      - name: Rebuild and test Gold
        working-directory: batch/dbt
        run: dbt build
      # dbt tests pass on empty tables, so check that the rows actually arrived.
      - name: Check Gold received the rows
        run: |
          orders=$(psql -h localhost -U streamcart -d streamcart_db -Atc "SELECT count(*) FROM gold.fct_orders")
          sessions=$(psql -h localhost -U streamcart -d streamcart_db -Atc "SELECT count(*) FROM gold.fct_sessions")
          stock=$(psql -h localhost -U streamcart -d streamcart_db -Atc "SELECT count(*) FROM gold.fct_inventory_snapshots")
          echo "orders=$orders sessions=$sessions stock=$stock"
          test "$orders" -eq 3 && test "$sessions" -eq 2 && test "$stock" -eq 2
      - name: Check the read-only login can read but not write
        env:
          PGPASSWORD: streamcart_reader
        run: |
          psql -h localhost -U streamcart_reader -d streamcart_db -Atc "SELECT count(*) FROM gold.fct_orders"
          if psql -h localhost -U streamcart_reader -d streamcart_db -c "DELETE FROM gold.fct_orders" 2>/dev/null; then
            echo "The read-only login was able to delete"; exit 1
          fi
      - name: Check the application login has no admin rights
        env:
          PGPASSWORD: streamcart_app
        run: |
          psql -h localhost -U streamcart_app -d streamcart_db -Atc "SELECT rolsuper, rolcreaterole, rolcreatedb FROM pg_roles WHERE rolname = current_user" | grep -qx 'f|f|f'
          if psql -h localhost -U streamcart_app -d streamcart_db -c "CREATE ROLE intruder" 2>/dev/null; then
            echo "The application login was able to create a role"; exit 1
          fi
      - name: Generate dbt docs
        working-directory: batch/dbt
        run: dbt docs generate
      - uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: |
            batch/dbt/target/index.html
            batch/dbt/target/manifest.json
            batch/dbt/target/catalog.json

  image:
    name: Build Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the platform image
        run: docker build -t streamcart-platform:ci .
      - name: Check the image's key tools
        run: |
          docker run --rm --entrypoint bash streamcart-platform:ci -c \
            'dbt --version && spark-submit --version && python -c "import pyspark, great_expectations, confluent_kafka"'
      - name: Build the API and Superset images
        run: |
          docker build -t streamcart-api:ci api
          docker build -t streamcart-superset:ci dashboards/superset
